<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow · smart todo</title>
    <style>
        /* ---------- global reset & fonts ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 10% 20%, #f0f5ff 0%, #e2eaff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #1a2639;
            line-height: 1.5;
        }

        /* ---------- main card ---------- */
        .app-card {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 2.5rem;
            box-shadow: 0 30px 50px -20px rgba(0, 20, 50, 0.3), 0 0 0 1px rgba(255,255,255,0.7);
            padding: 2rem 2rem 2rem 2rem;
            transition: box-shadow 0.3s;
        }

        .app-card:hover {
            box-shadow: 0 35px 60px -18px rgba(0, 30, 70, 0.35);
        }

        /* ---------- header ---------- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #0b1e3a;
        }

        .header h1 span {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 1.2rem;
            font-size: 1.8rem;
            box-shadow: 0 12px 22px -8px #3b82f6b0;
        }

        /* ---------- input area ---------- */
        .input-section {
            background: #f8fbff;
            border-radius: 2rem;
            padding: 0.25rem;
            margin-bottom: 1.5rem;
            border: 1px solid #e2edff;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
        }

        .input-row {
            display: flex;
            gap: 0.5rem;
            padding: 0.3rem;
        }

        .input-row input {
            flex: 1;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 2rem;
            background: white;
            outline: none;
            font-weight: 500;
            color: #0b1e3a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: 0.15s;
        }

        .input-row input::placeholder {
            color: #8ea1b8;
            font-weight: 400;
        }

        .input-row input:focus {
            box-shadow: 0 0 0 3px #3b82f640, 0 2px 10px rgba(59,130,246,0.1);
        }

        .input-row button {
            background: linear-gradient(135deg, #3b82f6, #4f46e5);
            color: white;
            border: none;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 600;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 14px 24px -10px #1e3a8a90;
            letter-spacing: 0.01em;
            white-space: nowrap;
        }

        .input-row button:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 28px -10px #1e3a8ac0;
            background: linear-gradient(135deg, #2563eb, #4338ca);
        }

        .input-row button:active {
            transform: translateY(1px);
            box-shadow: 0 10px 16px -10px #1e3a8a90;
        }

        /* ---------- stats bar ---------- */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.4rem;
            padding: 0 0.5rem;
        }

        .stats-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .pill {
            background: #eef4ff;
            padding: 0.45rem 1.1rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #1e3a8a;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .pill .count {
            background: #3b82f6;
            color: white;
            border-radius: 50px;
            padding: 0.1rem 0.6rem;
            font-size: 0.8rem;
            margin-left: 0.2rem;
        }

        .clear-btn {
            background: transparent;
            border: 1px solid #dbe7f5;
            color: #4b6589;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: 0.15s;
            background: white;
        }

        .clear-btn:hover {
            background: #fee9e9;
            border-color: #fecaca;
            color: #b91c1c;
            transform: scale(1.02);
        }

        .clear-btn:active {
            transform: scale(0.98);
        }

        /* ---------- todo list ---------- */
        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 0.2rem;
            margin-bottom: 0.5rem;
            scrollbar-width: thin;
            scrollbar-color: #b8cbe0 #eff4fa;
        }

        .todo-list::-webkit-scrollbar {
            width: 6px;
        }

        .todo-list::-webkit-scrollbar-track {
            background: #eff4fa;
            border-radius: 10px;
        }

        .todo-list::-webkit-scrollbar-thumb {
            background: #b8cbe0;
            border-radius: 10px;
        }

        /* ---------- todo item ---------- */
        .todo-item {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            background: white;
            padding: 1rem 1.4rem;
            border-radius: 2rem;
            border: 1px solid #e6edf8;
            box-shadow: 0 6px 14px -10px rgba(0, 0, 0, 0.08);
            transition: all 0.15s;
            animation: slideIn 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .todo-item:hover {
            border-color: #b8d0f0;
            box-shadow: 0 10px 20px -12px #1e3a8a30;
            transform: scale(1.005);
        }

        .todo-item.completed {
            background: #f9fcff;
            border-color: #d9e6f5;
            opacity: 0.85;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #7a8fa8;
            font-weight: 400;
        }

        /* custom checkbox */
        .todo-check {
            appearance: none;
            -webkit-appearance: none;
            width: 1.8rem;
            height: 1.8rem;
            border: 2.5px solid #cbdaea;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.12s;
            background: white;
            flex-shrink: 0;
            position: relative;
        }

        .todo-check:checked {
            background: linear-gradient(135deg, #3b82f6, #6d5ef5);
            border-color: #4f46e5;
            box-shadow: 0 4px 12px -6px #3b82f6b0;
        }

        .todo-check:checked::after {
            content: "✓";
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1;
            display: block;
            margin-top: -1px;
        }

        .todo-check:hover {
            border-color: #3b82f6;
            background: #eff6ff;
        }

        .todo-check:checked:hover {
            background: #2563eb;
            border-color: #2563eb;
        }

        /* task text */
        .todo-text {
            flex: 1;
            font-size: 1.05rem;
            font-weight: 520;
            word-break: break-word;
            transition: 0.1s;
            color: #122b4a;
            line-height: 1.4;
        }

        /* due date badge (optional feature) */
        .due-badge {
            font-size: 0.7rem;
            background: #f1f5f9;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            color: #4b6589;
            margin-left: 0.5rem;
            font-weight: 500;
            white-space: nowrap;
        }

        /* delete button */
        .delete-btn {
            background: transparent;
            border: none;
            font-size: 1.1rem;
            color: #9db3cc;
            cursor: pointer;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: 0.15s;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            background: #fee9e9;
            color: #dc2626;
            transform: scale(1.1);
        }

        .delete-btn:active {
            transform: scale(0.95);
        }

        /* ---------- empty state ---------- */
        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            background: #f6faff;
            border-radius: 2rem;
            border: 1px dashed #b8d0ea;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            color: #6a7f9a;
        }

        .empty-state .icon {
            font-size: 3rem;
            filter: drop-shadow(0 8px 12px #3b82f630);
            margin-bottom: 0.2rem;
        }

        .empty-state h3 {
            font-weight: 600;
            color: #1e3a5f;
            font-size: 1.3rem;
        }

        .empty-state p {
            font-size: 0.95rem;
            max-width: 280px;
        }

        /* ---------- footer ---------- */
        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #94aec9;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .footer-note span {
            background: #eef4ff;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
        }

        /* ---------- toast ---------- */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #0f1e36;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 3rem;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 20px 35px -10px black;
            opacity: 0;
            transition: 0.25s ease;
            pointer-events: none;
            z-index: 1000;
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ---------- responsive ---------- */
        @media (max-width: 550px) {
            .app-card { padding: 1.5rem; }
            .header h1 { font-size: 1.7rem; }
            .header h1 span { width: 2.5rem; height: 2.5rem; font-size: 1.4rem; }
            .input-row { flex-direction: column; }
            .input-row button { padding: 1rem; justify-content: center; }
            .todo-item { padding: 0.9rem 1rem; }
            .todo-text { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="app-card">
        <!-- header -->
        <div class="header">
            <h1>
                <span>✨</span>
                TaskFlow
            </h1>
        </div>

        <!-- input area -->
        <div class="input-section">
            <div class="input-row">
                <input type="text" id="todoInput" placeholder="What needs to be done?" autocomplete="off" maxlength="120">
                <button id="addBtn">
                    <span>+</span> Add task
                </button>
            </div>
        </div>

        <!-- stats bar -->
        <div class="stats-bar">
            <div class="stats-left">
                <div class="pill">
                    📋 <span id="taskCount">0 tasks</span>
                </div>
                <div class="pill" id="completedPill" style="display: none;">
                    ✅ <span id="completedCount">0</span> done
                </div>
            </div>
            <button class="clear-btn" id="clearCompletedBtn">
                🧹 Clear completed
            </button>
        </div>

        <!-- todo list -->
        <ul class="todo-list" id="todoList"></ul>

        <!-- footer -->
        <div class="footer-note">
            <span>✓ Click circle to complete</span>
            <span>✕ Remove task</span>
        </div>
    </div>

    <!-- toast notification -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ---------- storage & data ----------
            const STORAGE_KEY = 'taskflow_todos_v2';
            
            // default sample tasks (only used if nothing in storage)
            const defaultTodos = [
                { id: 'sample-1', text: 'Welcome to TaskFlow!', completed: false },
                { id: 'sample-2', text: 'Click the circle to mark done', completed: false },
                { id: 'sample-3', text: 'Add your own tasks below', completed: false }
            ];

            // Load from localStorage or use defaults
            let todos = [];
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    todos = JSON.parse(stored);
                    // ensure each todo has an id
                    todos = todos.map((t, i) => {
                        if (!t.id) t.id = 'loaded-' + Date.now() + '-' + i + '-' + Math.random().toString(36).substr(2, 6);
                        return t;
                    });
                } else {
                    todos = [...defaultTodos];
                }
            } catch (e) {
                console.warn('Failed to load, using defaults');
                todos = [...defaultTodos];
            }

            // ---------- DOM refs ----------
            const todoInput = document.getElementById('todoInput');
            const addBtn = document.getElementById('addBtn');
            const todoList = document.getElementById('todoList');
            const taskCountSpan = document.getElementById('taskCount');
            const completedPill = document.getElementById('completedPill');
            const completedCountSpan = document.getElementById('completedCount');
            const clearCompletedBtn = document.getElementById('clearCompletedBtn');
            const toastEl = document.getElementById('toast');

            // ---------- toast helper ----------
            let toastTimer = null;
            function showToast(message, emoji = '✨') {
                if (toastTimer) clearTimeout(toastTimer);
                toastEl.textContent = `${emoji}  ${message}`;
                toastEl.classList.add('show');
                toastTimer = setTimeout(() => {
                    toastEl.classList.remove('show');
                }, 2000);
            }

            // ---------- save to localStorage ----------
            function saveTodos() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
                } catch (e) {
                    console.warn('Could not save', e);
                }
            }

            // ---------- render everything ----------
            function render() {
                const total = todos.length;
                const completed = todos.filter(t => t.completed).length;
                const remaining = total - completed;

                // update stats
                if (total === 0) {
                    taskCountSpan.textContent = '0 tasks';
                    completedPill.style.display = 'none';
                } else {
                    taskCountSpan.textContent = `${remaining} of ${total} task${total !== 1 ? 's' : ''}`;
                    if (completed > 0) {
                        completedPill.style.display = 'flex';
                        completedCountSpan.textContent = completed;
                    } else {
                        completedPill.style.display = 'none';
                    }
                }

                // clear list
                todoList.innerHTML = '';

                // empty state
                if (total === 0) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'empty-state';
                    emptyDiv.innerHTML = `
                        <div class="icon">📝</div>
                        <h3>All clear!</h3>
                        <p>Your task list is empty. Add something to get started.</p>
                    `;
                    todoList.appendChild(emptyDiv);
                    return;
                }

                // render each todo
                todos.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                    li.dataset.id = todo.id;

                    // checkbox
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'todo-check';
                    checkbox.checked = todo.completed;
                    checkbox.setAttribute('aria-label', `Mark "${todo.text}" as ${todo.completed ? 'incomplete' : 'complete'}`);
                    
                    checkbox.addEventListener('change', (e) => {
                        e.stopPropagation();
                        toggleTodo(todo.id);
                    });

                    // text
                    const span = document.createElement('span');
                    span.className = 'todo-text';
                    span.textContent = todo.text;

                    // delete
                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.innerHTML = '✕';
                    delBtn.setAttribute('aria-label', `Delete "${todo.text}"`);
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteTodo(todo.id);
                    });

                    li.appendChild(checkbox);
                    li.appendChild(span);
                    li.appendChild(delBtn);
                    todoList.appendChild(li);
                });
            }

            // ---------- actions ----------
            function addTodo() {
                const text = todoInput.value.trim();
                if (text === '') {
                    // visual feedback
                    todoInput.style.boxShadow = '0 0 0 3px #f8717180';
                    setTimeout(() => {
                        todoInput.style.boxShadow = '0 2px 8px rgba(0,0,0,0.02)';
                    }, 300);
                    showToast('Please enter a task', '⚠️');
                    return;
                }

                const newTodo = {
                    id: 'todo-' + Date.now() + '-' + Math.random().toString(36).substr(2, 8),
                    text: text,
                    completed: false
                };

                todos.push(newTodo);
                saveTodos();
                render();

                todoInput.value = '';
                todoInput.focus();
                showToast('Task added', '✅');
            }

            function toggleTodo(id) {
                const todo = todos.find(t => t.id === id);
                if (todo) {
                    todo.completed = !todo.completed;
                    saveTodos();
                    render();
                    if (todo.completed) {
                        showToast('Task completed', '🎉');
                    } else {
                        showToast('Task reopened', '🔄');
                    }
                }
            }

            function deleteTodo(id) {
                const todo = todos.find(t => t.id === id);
                if (todo) {
                    todos = todos.filter(t => t.id !== id);
                    saveTodos();
                    render();
                    showToast('Task removed', '🗑️');
                }
            }

            function clearCompleted() {
                const hadCompleted = todos.some(t => t.completed);
                if (!hadCompleted) {
                    showToast('No completed tasks to clear', '🧹');
                    return;
                }
                const count = todos.filter(t => t.completed).length;
                todos = todos.filter(t => !t.completed);
                saveTodos();
                render();
                showToast(`Cleared ${count} completed task${count > 1 ? 's' : ''}`, '🧼');
            }

            // ---------- event listeners ----------
            addBtn.addEventListener('click', addTodo);
            todoInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addTodo();
                }
            });
            clearCompletedBtn.addEventListener('click', clearCompleted);

            // ---------- initial render ----------
            render();
            todoInput.focus();

            // optional: if there are sample todos, save them so they persist
            // (if using defaults, they'll be saved on first change)
            if (todos.length > 0 && !localStorage.getItem(STORAGE_KEY)) {
                saveTodos();
            }
        })();
    </script>
</body>
</html>
